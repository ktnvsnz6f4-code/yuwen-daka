<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🌸 语文背诵打卡小花园</title>
<style>
:root{
  --pink:#FF8FAB; --pink-d:#FF6FA5; --pink-l:#FFD6E4; --pink-xl:#FFF0F5;
  --cream:#FFFBF7; --purple:#B388EB; --purple-l:#E7D9FB;
  --gold:#FFC93C; --green:#7ED9A7; --blue:#8ECAE6;
  --ink:#5A4A52; --ink-l:#9A8690; --line:#FFE1EA;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:linear-gradient(160deg,#FFF5F8 0%,#FFEAF1 55%,#F7ECFF 100%);
  color:var(--ink);
  overflow-x:hidden;
}
#app{max-width:480px;margin:0 auto;min-height:100%;position:relative;padding-bottom:86px;}
/* 背景装饰 */
.bg-deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.bg-deco span{position:absolute;opacity:.5;font-size:22px;animation:floaty 7s ease-in-out infinite;}
.bg-deco .c1{top:6%;left:6%;}
.bg-deco .c2{top:16%;right:8%;animation-delay:1.2s;}
.bg-deco .c3{top:42%;left:3%;animation-delay:2s;font-size:17px;}
.bg-deco .c4{top:70%;right:5%;animation-delay:.6s;}
.bg-deco .c5{bottom:8%;left:12%;animation-delay:2.6s;}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-4deg);}50%{transform:translateY(-12px) rotate(5deg);}}
#app>*{position:relative;z-index:1;}

/* 顶部 */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 18px 10px;
}
.brand{display:flex;align-items:center;gap:10px;}
.mascot{
  width:46px;height:46px;border-radius:16px;background:linear-gradient(135deg,#FFB3C6,#FF8FAB);
  display:flex;align-items:center;justify-content:center;font-size:26px;
  box-shadow:0 4px 10px rgba(255,143,171,.35);
}
.brand h1{font-size:17px;line-height:1.2;}
.brand p{font-size:11px;color:var(--ink-l);margin-top:2px;}
.icon-btn{
  width:38px;height:38px;border-radius:13px;background:#fff;border:none;
  box-shadow:0 2px 8px rgba(255,143,171,.25);font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}

/* 主区域 */
main{padding:6px 16px 20px;}
.view{display:none;animation:fadein .3s ease;}
.view.active{display:block;}
@keyframes fadein{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

.card{
  background:#fff;border-radius:22px;box-shadow:0 6px 18px rgba(255,143,171,.16);
  padding:16px;margin-bottom:14px;border:1.5px solid var(--line);
}
.section-title{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:700;margin:14px 2px 10px;}
.section-title .ico{font-size:18px;}
.section-title small{margin-left:auto;font-weight:600;color:var(--ink-l);font-size:12px;}

/* 首页 */
.greet{font-size:21px;font-weight:800;margin:2px 2px 4px;}
.greet .wave{display:inline-block;animation:wave 2s ease-in-out infinite;}
@keyframes wave{0%,100%{transform:rotate(0);}25%{transform:rotate(14deg);}50%{transform:rotate(-6deg);}75%{transform:rotate(10deg);}}
.sub{font-size:12.5px;color:var(--ink-l);margin-bottom:12px;}

.streak-row{display:flex;gap:10px;margin-bottom:14px;}
.streak-box{
  flex:1;background:linear-gradient(135deg,#FFF1D6,#FFE3B3);border-radius:18px;padding:12px 14px;
  display:flex;align-items:center;gap:10px;border:1.5px solid #FFE3B3;
}
.streak-box .num{font-size:26px;font-weight:900;color:#E8890C;}
.streak-box .lab{font-size:11px;color:#B06D12;line-height:1.3;}
.mini-box{
  flex:1;background:#fff;border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:10px;
  border:1.5px solid var(--line);
}
.mini-box .num{font-size:20px;font-weight:900;color:var(--purple);}
.mini-box .lab{font-size:11px;color:var(--ink-l);line-height:1.3;}

.task-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.task-tag{font-size:11px;background:var(--pink-l);color:var(--pink-d);padding:3px 10px;border-radius:20px;font-weight:700;}
.task-title{font-size:17px;font-weight:800;margin:2px 0 4px;}
.task-sub{font-size:12px;color:var(--ink-l);}
.progress{height:10px;background:#FFE9F0;border-radius:10px;overflow:hidden;margin:12px 0 14px;}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FF8FAB,#FF6FA5);border-radius:10px;transition:width .5s ease;position:relative;}
.progress i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 2.2s linear infinite;}
@keyframes shine{from{transform:translateX(-100%);}to{transform:translateX(100%);}}
.progress-note{font-size:11.5px;color:var(--ink-l);text-align:right;}

.btn{
  display:flex;align-items:center;justify-content:center;gap:6px;width:100%;
  border:none;border-radius:16px;padding:13px;font-size:15px;font-weight:800;cursor:pointer;
  font-family:inherit;transition:transform .12s ease, box-shadow .12s ease;
}
.btn:active{transform:scale(.96);}
.btn-primary{background:linear-gradient(135deg,#FF8FAB,#FF6FA5);color:#fff;box-shadow:0 6px 14px rgba(255,111,165,.35);}
.btn-soft{background:var(--pink-xl);color:var(--pink-d);border:1.5px solid var(--pink-l);}
.btn-purple{background:linear-gradient(135deg,#C9A7EB,#B388EB);color:#fff;box-shadow:0 6px 14px rgba(179,136,235,.35);}
.btn-gold{background:linear-gradient(135deg,#FFD66B,#FFC93C);color:#8A5A00;box-shadow:0 6px 14px rgba(255,201,60,.4);}
.btn-row{display:flex;gap:10px;}
.btn-row .btn{flex:1;}
.btn:disabled{opacity:.55;filter:grayscale(.3);cursor:default;transform:none !important;}

/* 本周打卡 */
.week-dots{display:flex;justify-content:space-between;margin-top:10px;}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px;}
.wd .dot{width:34px;height:34px;border-radius:50%;background:#FFEFF4;border:1.5px dashed var(--pink-l);display:flex;align-items:center;justify-content:center;font-size:15px;color:#E9B7C7;}
.wd.done .dot{background:linear-gradient(135deg,#FFB3C6,#FF8FAB);border:none;color:#fff;}
.wd.today .dot{border:2px solid var(--pink-d);}
.wd .lbl{font-size:10px;color:var(--ink-l);}
.wd.done .lbl{color:var(--pink-d);font-weight:700;}

/* 背诵库 */
.unit-tag{font-size:12px;color:var(--pink-d);font-weight:800;margin:12px 2px 8px;}
.unit-tag:first-child{margin-top:2px;}
.book-item{
  display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:12px 14px;
  margin-bottom:9px;border:1.5px solid var(--line);cursor:pointer;box-shadow:0 3px 10px rgba(255,143,171,.10);
  transition:transform .12s ease;
}
.book-item:active{transform:scale(.98);}
.book-item .emo{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:23px;flex-shrink:0;}
.book-item .info{flex:1;min-width:0;}
.book-item .t{font-size:14.5px;font-weight:800;}
.book-item .s{font-size:11px;color:var(--ink-l);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.book-item .st{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:700;flex-shrink:0;}
.st-yes{background:#E4F9EC;color:#2E9E63;}
.st-no{background:#FFEFF4;color:#E891A8;}

/* 游戏 */
.game-menu{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.game-card{
  background:#fff;border-radius:20px;padding:18px 14px 14px;text-align:center;cursor:pointer;
  border:1.5px solid var(--line);box-shadow:0 5px 14px rgba(255,143,171,.14);transition:transform .12s ease;
}
.game-card:active{transform:scale(.97);}
.game-card .gemo{font-size:38px;margin-bottom:8px;display:inline-block;}
.game-card .gt{font-size:15px;font-weight:800;}
.game-card .gs{font-size:11px;color:var(--ink-l);margin-top:4px;line-height:1.4;}
.game-card .grew{margin-top:8px;font-size:11px;font-weight:700;color:var(--gold);background:#FFF7E3;border-radius:20px;padding:3px 8px;display:inline-block;}

.game-wrap{background:#fff;border-radius:22px;padding:18px 16px;box-shadow:0 6px 18px rgba(255,143,171,.16);border:1.5px solid var(--line);}
.game-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.game-top .back{font-size:12px;color:var(--ink-l);cursor:pointer;}
.game-top .score{font-size:13px;font-weight:800;color:#E8890C;}
.game-q{font-size:15px;font-weight:800;margin-bottom:4px;}
.game-p{font-size:12px;color:var(--ink-l);margin-bottom:12px;}
.blank-line{font-size:19px;line-height:1.9;text-align:center;margin:16px 0;color:var(--ink);letter-spacing:2px;}
.blank-line .bk{display:inline-block;min-width:2em;border-bottom:3px solid var(--pink);color:var(--pink-d);font-weight:900;margin:0 1px;}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
.opt{
  border:2px solid var(--line);border-radius:16px;padding:14px;font-size:16px;font-weight:800;text-align:center;
  background:var(--cream);cursor:pointer;transition:all .12s ease;color:var(--ink);font-family:inherit;
}
.opt:active{transform:scale(.95);}
.opt.correct{background:#E4F9EC;border-color:#7ED9A7;color:#2E9E63;}
.opt.wrong{background:#FFE8EC;border-color:#FF8FAB;color:#E85A7A;animation:shake .35s ease;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}

.pair-col{display:flex;flex-direction:column;gap:9px;}
.pair-lines{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px;}
.pair-lines .col{display:flex;flex-direction:column;gap:9px;}
.pair-item{
  border:2px solid var(--line);border-radius:14px;padding:11px 10px;font-size:14px;font-weight:700;
  text-align:center;background:var(--cream);cursor:pointer;transition:all .12s ease;line-height:1.5;
}
.pair-item:active{transform:scale(.97);}
.pair-item.sel{border-color:var(--pink-d);background:var(--pink-xl);box-shadow:0 0 0 3px rgba(255,111,165,.15);}
.pair-item.ok{border-color:#7ED9A7;background:#E4F9EC;color:#2E9E63;opacity:.85;cursor:default;}
.pair-item.bad{border-color:#FF8FAB;background:#FFE8EC;animation:shake .35s ease;}

.sort-area{margin-top:10px;}
.sort-slots{display:flex;flex-direction:column;gap:8px;min-height:56px;background:#FFF8FA;border:2px dashed var(--pink-l);border-radius:16px;padding:9px;margin-bottom:12px;}
.sort-slot{background:#fff;border:1.5px solid var(--pink-l);border-radius:12px;padding:9px 10px;font-size:14px;font-weight:700;text-align:center;}
.sort-pool{display:flex;flex-direction:column;gap:8px;}
.sort-chip{border:2px solid var(--line);border-radius:14px;padding:10px;font-size:14px;font-weight:700;text-align:center;background:var(--cream);cursor:pointer;transition:all .12s ease;}
.sort-chip:active{transform:scale(.97);}
.sort-chip.used{opacity:.25;pointer-events:none;}
.sort-chip.bad{border-color:#FF8FAB;background:#FFE8EC;animation:shake .35s ease;}

/* 卡册 */
.cards-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;}
.cd{
  aspect-ratio:.82;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;position:relative;overflow:hidden;box-shadow:0 5px 14px rgba(255,143,171,.18);
  border:2px solid #fff;transition:transform .15s ease;
}
.cd:active{transform:scale(.95) rotate(-2deg);}
.cd .ce{font-size:34px;margin-bottom:6px;}
.cd .cn{font-size:12px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.15);text-align:center;padding:0 4px;line-height:1.3;}
.cd.lock{background:linear-gradient(150deg,#F3E7EE,#EADFF0) !important;border:2px dashed #D9C2D6;}
.cd.lock .ce{filter:grayscale(.9);opacity:.55;}
.cd.lock .cn{color:#B9A2B5;text-shadow:none;}
.cd.new{animation:pop .5s ease;}
@keyframes pop{0%{transform:scale(.5);opacity:0;}70%{transform:scale(1.12);}100%{transform:scale(1);}}

.badge-row{display:flex;gap:9px;flex-wrap:wrap;margin:4px 0 6px;}
.badge{
  flex:1;min-width:92px;background:#fff;border-radius:16px;padding:10px 8px;text-align:center;border:1.5px solid var(--line);
  box-shadow:0 3px 10px rgba(255,143,171,.10);
}
.badge .be{font-size:22px;}
.badge .bn{font-size:10.5px;font-weight:800;margin-top:4px;}
.badge .bd{font-size:9.5px;color:var(--ink-l);margin-top:2px;line-height:1.3;}
.badge.off{filter:grayscale(.85);opacity:.5;}

/* 弹窗 */
.overlay{
  position:fixed;inset:0;background:rgba(90,60,80,.35);backdrop-filter:blur(3px);z-index:50;
  display:flex;align-items:center;justify-content:center;padding:22px;animation:fadein .2s ease;
}
.sheet{
  background:var(--cream);border-radius:26px;width:100%;max-width:400px;max-height:84vh;overflow-y:auto;
  padding:22px 20px;box-shadow:0 20px 50px rgba(120,60,90,.35);animation:sheetin .3s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes sheetin{from{transform:translateY(40px) scale(.94);opacity:0;}to{transform:none;opacity:1;}}
.sheet-x{position:sticky;top:0;float:right;background:var(--pink-xl);border:none;width:30px;height:30px;border-radius:50%;font-size:14px;color:var(--pink-d);cursor:pointer;font-weight:800;}
.modal-emo{font-size:52px;text-align:center;margin:6px 0 10px;}
.modal-title{font-size:18px;font-weight:900;text-align:center;margin-bottom:4px;}
.modal-sub{font-size:12.5px;color:var(--ink-l);text-align:center;margin-bottom:14px;line-height:1.5;}
.modal-actions{display:flex;flex-direction:column;gap:9px;margin-top:14px;}
.recite-lines{margin:12px 0 4px;}
.rline{font-size:15.5px;line-height:1.8;padding:6px 2px;border-bottom:1px dashed var(--pink-l);letter-spacing:.5px;}
.rline.hid{color:#E6CDD6;letter-spacing:2px;user-select:none;}
.rline .ra{color:var(--pink-d);font-weight:700;}

/* 语音练习 */
.speak-line{
  font-size:16px;font-weight:800;text-align:center;line-height:1.8;margin:10px 0 12px;
  background:#fff;border:1.5px dashed var(--pink-l);border-radius:16px;padding:14px 12px;color:var(--ink);
}
.speak-heard{font-size:13px;color:var(--ink-l);text-align:center;line-height:1.6;min-height:38px;}
.speak-heard b{color:var(--pink-d);}
.speak-score{font-size:13.5px;font-weight:800;text-align:center;margin:8px 0 2px;}
.speak-score.good{color:#2E9E63;}
.speak-score.mid{color:#E8890C;}
.speak-score.low{color:#E85A7A;}
.speak-mic{
  width:64px;height:64px;margin:8px auto 4px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:800;color:#fff;cursor:pointer;user-select:none;border:none;
  background:linear-gradient(135deg,#FF8FAB,#FF6FA5);box-shadow:0 8px 18px rgba(255,111,165,.4);
}
.speak-mic:active{transform:scale(.94);}
.speak-mic.rec{animation:pulse 1.1s ease-in-out infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,111,165,.45);}50%{box-shadow:0 0 0 16px rgba(255,111,165,0);}}

/* 卡片获得 */
.award-card{
  width:150px;height:190px;border-radius:18px;margin:0 auto 14px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;color:#fff;box-shadow:0 10px 26px rgba(0,0,0,.18);
  transform:rotate(-3deg);animation:carddrop .6s cubic-bezier(.2,.9,.3,1.4);
}
@keyframes carddrop{0%{transform:rotate(10deg) translateY(-60px);opacity:0;}100%{transform:rotate(-3deg);opacity:1;}}
.award-card .ae{font-size:48px;margin-bottom:8px;}
.award-card .an{font-size:15px;font-weight:900;}
.award-card .at{font-size:10.5px;opacity:.9;margin-top:3px;}

/* 彩带 */
.confetti{position:fixed;top:-20px;z-index:99;width:10px;height:14px;border-radius:3px;pointer-events:none;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.6;}}

/* 提示 */
#toast{
  position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);z-index:80;
  background:rgba(80,50,65,.88);color:#fff;font-size:13.5px;font-weight:700;padding:10px 18px;border-radius:30px;
  opacity:0;pointer-events:none;transition:all .3s ease;max-width:80%;text-align:center;white-space:nowrap;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* 底部导航 */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:480px;margin:0 auto;
  background:rgba(255,255,255,.94);backdrop-filter:blur(10px);
  border-top:1.5px solid var(--line);display:flex;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;cursor:pointer;color:var(--ink-l);font-size:10.5px;font-weight:700;border-radius:14px;transition:all .15s ease;}
.tab .ti{font-size:21px;transition:transform .15s ease;}
.tab.active{color:var(--pink-d);background:var(--pink-xl);}
.tab.active .ti{transform:translateY(-2px) scale(1.08);}

/* 设置项 */
.set-row{display:flex;align-items:center;justify-content:space-between;padding:12px 2px;border-bottom:1px dashed var(--pink-l);}
.set-row .sl{font-size:14px;font-weight:700;}
.set-row input{border:1.5px solid var(--pink-l);border-radius:10px;padding:7px 10px;font-size:13px;width:130px;font-family:inherit;text-align:right;color:var(--ink);background:#fff;}
.switch{width:48px;height:27px;border-radius:20px;background:#E5D5DC;position:relative;cursor:pointer;transition:background .2s;}
.switch.on{background:linear-gradient(90deg,#FF8FAB,#FF6FA5);}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 2px 5px rgba(0,0,0,.2);}
.switch.on::after{left:24px;}

.scrollable{max-height:52vh;overflow-y:auto;}
.gamers{font-size:12px;color:var(--ink-l);line-height:1.6;margin-bottom:6px;}
</style>
</head>
<body>
<div class="bg-deco"><span class="c1">🌸</span><span class="c2">🦋</span><span class="c3">⭐</span><span class="c4">🍓</span><span class="c5">🌷</span></div>

<div id="app">
  <header>
    <div class="brand">
      <div class="mascot">🐰</div>
      <div>
        <h1>语文背诵小花园</h1>
        <p id="subGreet">江苏五年级上册 · 统编版</p>
      </div>
    </div>
    <button class="icon-btn" onclick="openSettings()">⚙️</button>
  </header>

  <main>
    <!-- 首页 -->
    <section id="view-home" class="view active"></section>
    <!-- 背诵库 -->
    <section id="view-book" class="view"></section>
    <!-- 游戏 -->
    <section id="view-game" class="view"></section>
    <!-- 卡册 -->
    <section id="view-cards" class="view"></section>
  </main>

  <nav class="tabbar">
    <div class="tab active" data-v="home" onclick="switchTab('home')"><span class="ti">🏡</span>今日</div>
    <div class="tab" data-v="book" onclick="switchTab('book')"><span class="ti">📖</span>背诵</div>
    <div class="tab" data-v="game" onclick="switchTab('game')"><span class="ti">🎮</span>游戏</div>
    <div class="tab" data-v="cards" onclick="switchTab('cards')"><span class="ti">🎴</span>卡册</div>
  </nav>
</div>

<div id="modal-root"></div>
<div id="toast"></div>

<script>
"use strict";
/* ============ 数据 ============ */
const ITEMS=[
 {id:"b1",unit:"课文背诵",type:"课文",emo:"🦢",card:"白鹭仙子",theme:"linear-gradient(135deg,#A8E6CF,#3EBD93)",title:"白鹭",author:"郭沫若",lines:[
   "白鹭是一首精巧的诗。",
   "色素的配合，身段的大小，一切都很适宜。",
   "白鹤太大而嫌生硬，即使如粉红的朱鹭或灰色的苍鹭，也觉得大了一些，而且太不寻常了。",
   "然而白鹭却因为它的常见，而被人忘却了它的美。",
   "那雪白的蓑毛，那全身的流线型结构，那铁色的长喙，那青色的脚，增之一分则嫌长，减之一分则嫌短，素之一忽则嫌白，黛之一忽则嫌黑。",
   "在清水田里，时有一只两只白鹭站着钓鱼，整个的田便成了一幅嵌在琉璃框里的画面。田的大小好像是有心人为白鹭设计的镜匣。",
   "晴天的清晨，每每看见它孤独地站立于小树的绝顶，看来像是不安稳，而它却很悠然。这是别的鸟很难表现的一种嗜好。人们说它是在望哨，可它真是在望哨吗？",
   "黄昏的空中偶见白鹭的低飞，更是乡居生活中的一种恩惠。那是清澄的形象化，而且具有了生命了。",
   "或许有人会感到美中不足，白鹭不会唱歌。但是白鹭本身不就是一首很优美的歌吗？——不，歌未免太铿锵了。",
   "白鹭实在是一首诗，一首韵在骨子里的散文诗。"]},
 {id:"b2",unit:"课文背诵",type:"课文",emo:"🌟",card:"少年志气卡",theme:"linear-gradient(135deg,#FFD6A5,#FF9F1C)",title:"少年中国说（节选）",author:"梁启超",lines:[
   "故今日之责任，不在他人，而全在我少年。少年智则国智，少年富则国富；少年强则国强，少年独立则国独立；少年自由则国自由，少年进步则国进步；少年胜于欧洲，则国胜于欧洲；少年雄于地球，则国雄于地球。",
   "红日初升，其道大光。河出伏流，一泻汪洋。潜龙腾渊，鳞爪飞扬。乳虎啸谷，百兽震惶。鹰隼试翼，风尘翕张。奇花初胎，矞矞皇皇。干将发硎，有作其芒。天戴其苍，地履其黄。纵有千古，横有八荒。前途似海，来日方长。美哉，我少年中国，与天不老！壮哉，我中国少年，与国无疆！"]},
 {id:"b3",unit:"课文背诵",type:"课文",emo:"🍂",card:"四季信笺卡",theme:"linear-gradient(135deg,#B5EAD7,#54B0C6)",title:"四季之美",author:"〔日〕清少纳言",lines:[
   "春天最美是黎明。东方一点儿一点儿泛着鱼肚色的天空，染上微微的红晕，飘着红紫红紫的彩云。",
   "夏天最美是夜晚。明亮的月夜固然美，漆黑漆黑的暗夜，也有无数的萤火虫翩翩飞舞。即使是蒙蒙细雨的夜晚，也有一只两只萤火虫，闪着朦胧的微光在飞行，这情景着实迷人。",
   "秋天最美是黄昏。夕阳斜照西山时，动人的是点点归鸦急急匆匆地朝窠里飞去。成群结队的大雁，在高空中比翼而飞，更是叫人感动。夕阳西沉，夜幕降临，那风声、虫鸣，听起来也愈发叫人心旷神怡。",
   "冬天最美是早晨。落雪的早晨当然美，就是在遍地铺满白霜的早晨，或是在无雪无霜的凛冽的清晨，也要生起熊熊的炭火。手捧着暖和的火盆穿过走廊时，那闲逸的心情和这寒冷的冬晨多么和谐啊！只是到了中午，寒气渐退，火盆里的火炭，大多变成了一堆白灰，这未免令人有点儿扫兴。"]},
 {id:"b4",unit:"课文背诵",type:"课文",emo:"📚",card:"书香墨韵卡",theme:"linear-gradient(135deg,#CDB4DB,#8E5BB0)",title:"古人谈读书",author:"《论语》/朱熹/曾国藩",lines:[
   "敏而好学，不耻下问。知之为知之，不知为不知，是知也。默而识之，学而不厌，诲人不倦。——《论语》",
   "余尝谓：读书有三到，谓心到、眼到、口到。心不在此，则眼不看仔细，心眼既不专一，却只漫浪诵读，决不能记，记亦不能久也。三到之中，心到最急。心既到矣，眼口岂不到乎？——〔宋〕朱熹",
   "盖士人读书，第一要有志，第二要有识，第三要有恒。有志则断不甘为下流；有识则知学问无尽，不敢以一得自足，如河伯之观海，如井蛙之窥天，皆无识者也；有恒者则断无不成之事。此三者缺一不可。——〔清〕曾国藩"]},
 {id:"p1",unit:"古诗背诵",type:"古诗",emo:"🏮",card:"爱国诗篇卡",theme:"linear-gradient(135deg,#F8AD9D,#F08080)",title:"古诗三首（第11课）",author:"陆游/林升/龚自珍",lines:[

   "死去元知万事空，但悲不见九州同。",

 {id:"p2",unit:"古诗背诵",type:"古诗",emo:"🏔️",card:"山水诗画卡",theme:"linear-gradient(135deg,#A0D2EB,#4E9BD9)",title:"古诗三首（第20课）",author:"王维/张继/纳兰性德",lines:[

 {id:"j1",unit:"日积月累",type:"日积月累",emo:"🛶",card:"送别诗卡",theme:"linear-gradient(135deg,#BFDBAE,#5B9A55)",title:"语文园地一·黄鹤楼送孟浩然之广陵",author:"〔唐〕李白",lines:[

 {id:"j2",unit:"日积月累",type:"日积月累",emo:"⏰",card:"惜时星光卡",theme:"linear-gradient(135deg,#FFE3B3,#F5A623)",title:"语文园地二·惜时名言",author:"陶渊明/岳飞/朱熹/毛泽东",lines:[

/* ============ 状态 ============ */
const DEFAULT={name:"",sound:true,coins:0,completed:{},checkins:{},streak:0,lastCheckin:"",gamesPlayed:0,gameToday:{},badges:{},recited:{},seenCards:{}};
let S=load();
function load(){
  try{const raw=localStorage.getItem("yw5a_garden");
    if(raw){const d=JSON.parse(raw);return Object.assign({},DEFAULT,d);}
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT));
}
function save(){try{localStorage.setItem("yw5a_garden",JSON.stringify(S));}catch(e){}}
const tfmt=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const todayStr=()=>tfmt(new Date());
function yestStr(){const d=new Date();d.setDate(d.getDate()-1);return tfmt(d);}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function rnd(n){return Math.floor(Math.random()*n);}
function recommend(){
  const notDone=ITEMS.filter(i=>!S.completed[i.id]);
  if(notDone.length)return notDone[0];
  const t=todayStr();
  const arr=ITEMS.filter(i=>S.recited[i.id]!==t).sort((a,b)=>(S.recited[a.id]||"").localeCompare(S.recited[b.id]||""));
  if(arr.length)return arr[0];
  return ITEMS[0];
}
const checkedToday=()=>!!S.checkins[todayStr()];

/* ============ 音效 ============ */
let AC=null;
function tone(f,d,type,delay){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime+(delay||0);const o=AC.createOscillator();const g=AC.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(.12,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d+.02);}catch(e){}}
const sClick=()=>tone(520,.08);
const sOk=()=>{tone(660,.12);tone(880,.16,null,.09);};
const sBad=()=>tone(220,.2,"square");
const sWin=()=>{tone(523,.14);tone(659,.14,null,.13);tone(784,.22,null,.26);};

/* ============ 工具 ============ */
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1900);}
function confetti(n){
  const colors=["#FF8FAB","#FFC93C","#B388EB","#7ED9A7","#8ECAE6","#FF6FA5"];
  for(let i=0;i<(n||36);i++){
    const d=document.createElement("div");d.className="confetti";
    d.style.left=Math.random()*100+"vw";
    d.style.background=colors[rnd(colors.length)];
    d.style.animationDuration=(1.6+Math.random()*1.4)+"s";
    d.style.animationDelay=(Math.random()*.3)+"s";
    d.style.transform="rotate("+rnd(360)+"deg)";
    document.body.appendChild(d);
    setTimeout(()=>d.remove(),3200);
  }
}
function openModal(html){
  const r=document.getElementById("modal-root");
  r.innerHTML='<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet">'+html+"</div></div>";
}
function closeModal(){document.getElementById("modal-root").innerHTML="";}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

/* ============ 页面切换 ============ */
function switchTab(v){
  document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));
  document.getElementById("view-"+v).classList.add("active");
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.v===v));
  sClick();
  if(v==="home")renderHome();
  if(v==="book")renderBook();
  if(v==="game")renderGame();
  if(v==="cards")renderCards();
}

/* ============ 首页 ============ */

  const total=ITEMS.length;
  const pct=Math.round(done/total*100);
  const h=new Date().getHours();
  const greet=h<6?"夜深啦，早点休息哦":h<11?"早上好":h<14?"中午好":h<18?"下午好":"晚上好";

  const st=checkedToday();

  for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);week.push({d,ds:tfmt(d),isToday:i===0});}

   '<div class="streak-row">'+
     '<div class="streak-box"><div class="num">'+S.streak+'</div><div class="lab">连续打卡<br>（天）</div></div>'+
     '<div class="mini-box"><div class="num">⭐'+S.coins+'</div><div class="lab">星星收集<br>玩游戏可得</div></div>'+
     '<div class="mini-box"><div class="num">🎴'+(done)+'/'+total+'</div><div class="lab">卡片收集<br>背完就集卡</div></div>'+
   '</div>'+
   '<div class="card">'+
     '<div class="task-head"><span class="task-tag">'+(st?"今日已完成 ✅":"今日任务")+'</span><span style="font-size:11px;color:var(--ink-l)">'+item.type+'</span></div>'+
     '<div class="task-title">'+(st?"太棒啦！今天任务完成啦 🎉":"📖 "+item.title)+'</div>'+

     '<div class="progress"><i style="width:'+pct+'%"></i></div>'+
     '<div class="progress-note">全册背诵进度 '+done+'/'+total+'（'+pct+'%）</div>'+
     '<div style="height:12px"></div>'+
     (st?
       '<button class="btn btn-soft" onclick="openItem(\''+item.id+'\')">再复习一遍 📖</button>'
       :
       '<div class="btn-row"><button class="btn btn-primary" onclick="openItem(\''+item.id+'\')">开始背诵 ✏️</button>'+
       '<button class="btn btn-gold" onclick="confirmCheckin(\''+item.id+'\')">我会背啦，打卡！</button></div>')+
   '</div>'+
   '<div class="btn-row" style="margin-top:9px">'+
     '<button class="btn btn-soft" onclick="readAloud(\''+item.id+'\')">🔊 读给我听</button>'+
     '<button class="btn btn-soft" onclick="openSpeak(\''+item.id+'\')">🎤 听我背诵</button>'+
   '</div>'+
   '<div class="section-title"><span class="ico">📅</span>本周打卡小脚印<small>打卡天数：'+week.filter(w=>S.checkins[w.ds]).length+'/7</small></div>'+
   '<div class="card"><div class="week-dots">'+

/* ============ 语音：朗读 & 跟读（浏览器原生，无需微信插件） ============ */
let SPEAKING=false;
function readAloud(id){
  const item=ITEMS.find(i=>i.id===id);
  if(!("speechSynthesis" in window)){toast("当前浏览器不支持朗读，请用 Chrome/Edge 打开");return;}
  if(SPEAKING){speechSynthesis.cancel();SPEAKING=false;toast("已停止朗读");return;}
  speechSynthesis.cancel();
  SPEAKING=true;
  const n=item.lines.length;
  item.lines.forEach((line,i)=>{
    const u=new SpeechSynthesisUtterance(line);
    u.lang="zh-CN";u.rate=0.8;u.pitch=1;
    u.onend=()=>{if(i===n-1)SPEAKING=false;};
    u.onerror=()=>{if(i===n-1)SPEAKING=false;};
    speechSynthesis.speak(u);
  });
  toast("开始朗读啦，再点一次可停止 🔊");
}

let REC=null,REC_LISTENING=false,REC_ITEM=null,REC_IDX=0,REC_HEARD="",REC_SCORE=-1;
function getSR(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  return SR?new SR():null;
}
function cleanLine(s){
  return String(s||"").replace(/[\s\u3000，。！？、；：""''「」《》（）·—…～!?.,;:]/g,"");
}
function scoreLine(target,heard){
  const t=cleanLine(target),h=cleanLine(heard);
  if(!t||!h)return 0;
  const used=new Array(h.length).fill(false);
  let same=0;
  for(const ch of t){
    let j=h.indexOf(ch);
    while(j>=0&&used[j])j=h.indexOf(ch,j+1);
    if(j>=0){same++;used[j]=true;}
  }
  return Math.round(same/t.length*100);
}
function speakComment(sc){
  if(sc>=90)return "太棒了！背得一字不差 🎉";
  if(sc>=75)return "真不错！已经很熟啦 👏";
  if(sc>=60)return "还行，再练一遍会更熟 💪";
  return "再听一遍，跟着读一读试试 🌱";
}
function speakModalHTML(){
  const line=REC_ITEM.lines[REC_IDX];
  const total=REC_ITEM.lines.length;
  return (
   '<button class="sheet-x" onclick="stopRec();closeModal()">✕</button>'+
   '<div class="modal-emo">🎤</div>'+
   '<div class="modal-title">听我背诵</div>'+
   '<div class="modal-sub">《'+REC_ITEM.title+'》 第 '+(REC_IDX+1)+' / '+total+' 句</div>'+
   '<div class="speak-line">'+esc(line)+'</div>'+
   '<div class="speak-heard">'+(REC_HEARD?('你背的是：<b>'+esc(REC_HEARD)+'</b>'):'点下面的麦克风，大声背出来～')+'</div>'+
   (REC_SCORE>=0?'<div class="speak-score '+(REC_SCORE>=75?"good":REC_SCORE>=60?"mid":"low")+'">'+speakComment(REC_SCORE)+'</div>':'')+
   '<div class="speak-mic'+(REC_LISTENING?" rec":"")+'" onclick="toggleRec()">'+(REC_LISTENING?"⏹ 停止":"🎙️ 开始")+'</div>'+
   '<div class="modal-actions">'+
     (REC_IDX<total-1?'<button class="btn btn-soft" onclick="nextLine()">下一句 ➡️</button>':'')+
     '<button class="btn btn-soft" onclick="stopRec();closeModal()">完成</button>'+
   '</div>');
}
function refreshSpeak(){
  const r=document.getElementById("modal-root");
  r.innerHTML='<div class="overlay" onclick="if(event.target===this){stopRec();closeModal();}"><div class="sheet">'+speakModalHTML()+"</div></div>";
}
function openSpeak(id){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast("当前浏览器不支持语音识别，请用 Chrome/Edge 或安卓微信打开");return;}
  const item=ITEMS.find(i=>i.id===id);
  REC_ITEM=item;REC_IDX=0;REC_HEARD="";REC_SCORE=-1;REC_LISTENING=false;
  refreshSpeak();
}
function toggleRec(){
  if(REC_LISTENING){stopRec();return;}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast("当前浏览器不支持语音识别");return;}
  try{REC=new SR();}catch(e){toast("无法启动语音识别");return;}
  REC.lang="zh-CN";REC.interimResults=false;REC.continuous=false;REC.maxAlternatives=1;
  REC.onresult=e=>{
    REC_HEARD=(e.results[0][0].transcript||"").trim();
    REC_SCORE=scoreLine(REC_ITEM.lines[REC_IDX],REC_HEARD);
    REC_LISTENING=false;
    refreshSpeak();
  };
  REC.onerror=()=>{REC_LISTENING=false;refreshSpeak();toast("没听清，再试一次");};
  REC.onend=()=>{REC_LISTENING=false;refreshSpeak();};
  REC_LISTENING=true;
  try{REC.start();}catch(e){REC_LISTENING=false;toast("无法启动语音识别");}
  refreshSpeak();
}
function stopRec(){
  REC_LISTENING=false;
  if(REC){try{REC.stop();}catch(e){}}
  refreshSpeak();
}
function nextLine(){
  if(!REC_ITEM)return;
  if(REC_IDX<REC_ITEM.lines.length-1){REC_IDX++;REC_HEARD="";REC_SCORE=-1;stopRec();}
}

/* —— 游戏1：诗句填空 —— */
let FILL=null;
function startFill(){
  const qs=[];const pool=[];
  POEMS.forEach(p=>p.lines.forEach(l=>{for(const ch of l){if(ch.charCodeAt(0)>0x2E80)pool.push(ch);}}));
  shuffle(POEMS).slice(0,5).forEach(p=>{
    const line=p.lines[rnd(p.lines.length)];
    const idxs=[];for(let i=0;i<line.length;i++){if(line.charCodeAt(i)>0x2E80)idxs.push(i);}
    const idx=idxs[rnd(idxs.length)];
    const ch=line[idx];
    const opts=[ch];while(opts.length<4){const c=pool[rnd(pool.length)];if(opts.indexOf(c)<0)opts.push(c);}
    qs.push({title:p.title,author:p.author,line,idx,ch,opts:shuffle(opts)});
  });
  FILL={qs,qi:0,score:0,correct:0};
  renderFillQ();
}
function renderFillQ(){
  const q=FILL.qs[FILL.qi];
  const shown=q.line.slice(0,q.idx)+"＿"+q.line.slice(q.idx+1);
  document.getElementById("view-game").innerHTML=gameShell(
   '<div class="game-top"><span>🧩 诗句填空</span><span class="score">⭐ '+FILL.score+'</span></div>'+
   '<div class="game-q">第 '+(FILL.qi+1)+' / '+FILL.qs.length+' 题</div>'+
   '<div class="game-p">《'+q.title+'》'+q.author+'</div>'+
   '<div class="blank-line">'+shown+'</div>'+
   '<div class="opts">'+q.opts.map(o=>'<div class="opt" onclick="fillPick(\''+o+'\',this)">'+o+'</div>').join("")+'</div>');
}
function fillPick(ch,el){
  if(el.classList.contains("correct")||el.classList.contains("wrong"))return;
  const q=FILL.qs[FILL.qi];
  if(ch===q.ch){
    el.classList.add("correct");sOk();FILL.score+=2;FILL.correct++;
    setTimeout(()=>{FILL.qi++;if(FILL.qi<FILL.qs.length)renderFillQ();else fillEnd();},500);
  }else{el.classList.add("wrong");sBad();}
}
function fillEnd(){
  const bonus=dailyBonus("fill");
  S.gamesPlayed++;S.coins+=FILL.score;save();
  const star=FILL.score+(bonus?3:0);
  gameEndModal("🎉","填空完成！","答对 "+FILL.correct+" / "+FILL.qs.length+" 题，获得 ⭐×"+star+(bonus?"（含今日首通奖励 +3）":"")+"","fill");
  renderGame();
}

/* —— 游戏2：诗句连连看 —— */
let PAIR=null;
function startPair(){
  const pairs=[];
  POEMS.forEach(p=>{for(let i=0;i+1<p.lines.length;i+=2){pairs.push({u:p.lines[i],d:p.lines[i+1],t:p.title});}});
  const chosen=shuffle(pairs).slice(0,5);
  PAIR={pairs:chosen,sel:null,left:shuffle(chosen.map((c,i)=>({id:i,txt:c.u}))),right:shuffle(chosen.map((c,i)=>({id:i,txt:c.d}))),score:0,done:0,bad:null};
  renderPair();
}
function renderPair(){
  const c=(arr,side)=>arr.map((it,i)=>{
    const isDone=!!it._done;
    let cls="pair-item";
    if(PAIR.sel&&PAIR.sel[side]===i)cls+=" sel";
    if(isDone)cls+=" ok";
    if(PAIR.bad&&PAIR.bad[side]===i)cls+=" bad";
    return '<div class="'+cls+'" onclick="pairPick(\''+side+'\','+i+')">'+it.txt+'</div>';
  }).join("");
  document.getElementById("view-game").innerHTML=gameShell(
   '<div class="game-top"><span>🪄 诗句连连看</span><span class="score">已配对 '+PAIR.done+' / '+PAIR.pairs.length+'</span></div>'+
   '<div class="game-p">先点上面一句，再点下面一句，把上下句连起来</div>'+
   '<div class="pair-lines"><div class="col">'+c(PAIR.left,"l")+'</div><div class="col">'+c(PAIR.right,"r")+'</div></div>');
}
function pairPick(side,idx){
  const arr=PAIR[side==="l"?"left":"right"];
  if(arr[idx]._done)return;
  if(!PAIR.sel)PAIR.sel={l:null,r:null};
  if(PAIR.sel[side]===idx){PAIR.sel[side]=null;renderPair();return;}
  PAIR.sel[side]=idx;
  renderPair();
  if(PAIR.sel.l!==null&&PAIR.sel.r!==null){
    const a=PAIR.left[PAIR.sel.l],b=PAIR.right[PAIR.sel.r];
    if(a.id===b.id){
      a._done=true;b._done=true;PAIR.pairs[a.id]._ok=a.id;
      PAIR.done++;PAIR.score++;sOk();PAIR.sel=null;renderPair();
      if(PAIR.done===PAIR.pairs.length)pairEnd();
    }else{
      PAIR.bad={l:PAIR.sel.l,r:PAIR.sel.r};PAIR.sel=null;sBad();renderPair();
      setTimeout(()=>{PAIR.bad=null;renderPair();},450);
    }
  }
}
function pairEnd(){
  const bonus=dailyBonus("pair");
  S.gamesPlayed++;S.coins+=PAIR.score;save();
  const star=PAIR.score+(bonus?3:0);
  gameEndModal("🌟","全部配对成功！","获得 ⭐×"+star+(bonus?"（含今日首通奖励 +3）":"")+"","pair");
  renderGame();
}

/* —— 游戏3：诗句排排坐 —— */
let SORT=null;
function startSort(){
  const p=POEMS[rnd(POEMS.length)];
  let chosen=p.lines.slice();
  if(chosen.length>4){const st=rnd(chosen.length-3);chosen=chosen.slice(st,st+4);}
  SORT={title:p.title,author:p.author,target:chosen,pool:shuffle(chosen.map(t=>({txt:t,used:false}))),slots:[],bad:-1};
  renderSort();
}
function renderSort(){
  document.getElementById("view-game").innerHTML=gameShell(
   '<div class="game-top"><span>🧸 诗句排排坐</span><span class="score">已排 '+SORT.slots.length+' / '+SORT.target.length+'</span></div>'+
   '<div class="game-p">《'+SORT.title+'》'+SORT.author+'：按正确顺序点下面的句子</div>'+
   '<div class="sort-area"><div class="sort-slots">'+
     (SORT.slots.length?SORT.slots.map(s=>'<div class="sort-slot">'+s+'</div>').join(""):'<div style="font-size:12px;color:var(--ink-l);text-align:center;padding:10px">点下面的句子，把它们排成一首诗～</div>')+
   '</div><div class="sort-pool">'+
     SORT.pool.map((it,i)=>'<div class="sort-chip'+(it.used?" used":"")+(SORT.bad===i?" bad":"")+'" onclick="sortPick('+i+')">'+it.txt+'</div>').join("")+
   '</div></div>');
}
function sortPick(idx){
  const it=SORT.pool[idx];
  if(it.used)return;
  if(it.txt===SORT.target[SORT.slots.length]){
    it.used=true;SORT.slots.push(it.txt);sOk();renderSort();
    if(SORT.slots.length===SORT.target.length)sortEnd();
  }else{
    SORT.bad=idx;sBad();renderSort();
    setTimeout(()=>{SORT.bad=-1;renderSort();},450);
  }
}
function sortEnd(){
  const bonus=dailyBonus("sort");
  S.gamesPlayed++;S.coins+=3;save();
  const star=3+(bonus?3:0);
  gameEndModal("🧸","排好一首诗啦！","《"+SORT.title+"》完成！获得 ⭐×"+star+(bonus?"（含今日首通奖励 +3）":"")+"","sort");
  renderGame();
}

renderHome();
</script>
